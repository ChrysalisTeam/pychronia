[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"


[project]
name = "pychronia"
version = "0.1.0"
description = "Portal for alternate reality games, built on Django and ZODB"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PKL", email = "pythoniks@gmail.com" }]
requires-python = ">=3.11"

dependencies = [
    "PyMySQL>=1.0.2",
    "Django>=5.2",
    "Pillow>=11",
    "easy-thumbnails[svg]>=2.8.5",
    "django-filer>=3.0.3",
    "ZODB>=5.7.0",
    "django-zodb",  # see [tool.uv.sources]
    # needed by django-zodb for mysql:// ZODB_URL (prod) and by bin/daily_game_maintenance.sh (zodbpack)
    "RelStorage>=3.5",
    "PyYAML>=6.0.2",
    "pycryptodome>=3.14.1",
    "python-aiml",  # see [tool.uv.sources]
    # Django-Select2==4.2.2 is OUTDATED, and then form "fields" were removed from project...
    "Django-Select2",  # see [tool.uv.sources]
    "beautifulsoup4>=4.11.1",
    "django-sekizai>=4",
    # pychronia_game.common uses decoratorx, so that rsdecorator can flatten the signatures of decorated methods
    "decorator>=5",
    "RSDecorator>=0.1.0",
    "requests>=2.28.0",
    "pytz",
    "docutils",
    "pyparsing>=3.1.1",
    "django-environ>=0.12",  # reads the untracked .env file of dev/prod settings, see config/settings/
    "pymemcache>=4",  # memcached client of the CACHE_URL setting of prod (pymemcache://...), see config/settings/_prod_base.py
]

[project.scripts]
# django-admin equivalents, with the DEV settings of each site by default, eg. "uv run pychronia-game runserver"
pychronia-game = "config.cli:game"
pychronia-cms = "config.cli:cms"

[project.optional-dependencies]
# Django-CMS portal (pychronia_cms package). Verified working on Django 5.1.15 as of the
# 2026-10-15 cms-upgrade-ladder (Django 2.2.13 -> 5.1.15, django-cms 3.6.0 -> 5.0.13), run
# from the detached "cms-upgrade-ladder" worktree/branch - see DJANGO_CMS_UPGRADE_REPORT.md
# for the full rung-by-rung history and data-migration steps. Versions below are the ones
# actually exercised by that ladder (not aspirational pins); some differ from what this
# extra used to declare because those older pins were never actually verified to work.
cms = [
    "django-cms==5.1.3",  # django6-upgrade-ladder rung: 5.0.13->5.1.3, first cms release declaring Django 6.0/6.1 support
    # cms4+ architecture (Title->PageContent, PageUrl, versioned placeholders) requires these two:
    "djangocms-versioning==2.8.0",
    "djangocms-alias==3.2.0",
    "djangocms-admin-style==3.3.1",
    "djangocms-page-sitemap==1.4.0",
    # djangocms-text-ckeditor replaced by djangocms-text (the successor plugin); its own
    # migrations auto-copy existing TextPlugin.body rows and drop the old ckeditor table.
    "djangocms-text==1.0.2",
    "nh3",  # djangocms-text's HTML sanitizer
    "lxml",  # djangocms-text's HTML parser
    "html5lib",  # djangocms-text's extract_images(), run on every Text.save() since TEXT_SAVE_IMAGE_FUNCTION is set
    "djangocms-link==5.2.0",
    "djangocms-snippet==5.0.2",
    "djangocms-rawhtml==1.3.0",
    # cmsplugin-filer removed (rung 11 Stage B): abandoned, no cms4+ release. Its live
    # FilerImagePlugin/FilerVideoPlugin rows were migrated in-place to the two plugins below.
    "djangocms-picture==4.1.1",
    "djangocms-video==3.1.0",
    "django-filer>=3.6.0",  # bumped past the 1.x line now that cmsplugin-filer is removed above
    "easy-thumbnails[svg]>=2.10.1",  # <2.10.1's scale_and_crop processor hardcodes the Pillow-10-removed Image.ANTIALIAS
    "cmsplugin-rst>=0.3",  # now on PyPI as a proper release; no longer needs [tool.uv.sources]
    "cmsplugin-simple-gallery",  # see [tool.uv.sources]
    "django-inline-ordering>=1.0.2",  # for cmsplugin-simple-gallery
    "django-cms-jplayer",  # see [tool.uv.sources]
    # django-blog-zinnia + cmsplugin-zinnia replaced by djangocms-stories (django-cms's own
    # officially-endorsed blog successor for cms4+, since the zinnia line is abandoned and
    # has no cms4+-compatible release); entries migrated by
    # cms4_data_fix_migrate_zinnia_to_stories.py, see DJANGO_CMS_UPGRADE_REPORT.md.
    "djangocms-stories==0.9.3",
    "django-meta>=2",
    "django-parler>=2",
    "django-sortedm2m",
    "django-taggit>=1",
    "django-taggit-templatetags",
    "django-treebeard",
    "django-reversion>=6.5.2",
    "django-request",  # see [tool.uv.sources]; for quick HTTP visit stats
    "django-apptemplates==1.4",
    "django-appconf==1.0.3",
    "django-admin-jqueryui==1.8.22",  # obsolete stuff
]

[dependency-groups]
dev = [
    "pytest>=7.1.2",
    "pip-review",
    "logging_tree",
    "django-cprofile-middleware>=1.0.5",
    "django_debug_toolbar",
    # used to compile MetalRadiance SCSS sources, see pychronia_common/static/MetalRadiance/build.bat ;
    # pyscss==1.4.0 is abandoned and incompatible with Python 3.11+'s stricter "re" module, so it is
    # patched at runtime by scss_build.py before compiling
    "pyscss==1.4.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.5",
    "pytest-django>=4.14.0",
]


[tool.uv]
# The legacy pins of the "cms" extra declare obsolete upper bounds, which we ignore.
# django-polymorphic: django-filer's own metadata caps it below what cms4+/Django 5.1 needs
# (already proven safe to override, verified throughout the cms-upgrade-ladder).
override-dependencies = [
    "Django>=5.2",
    "django-polymorphic>=3.0.0",
]
# the project itself is installed (in editable mode) into the virtualenv, so that its root folder and its
# "vendor/" folder are importable from anywhere, without PYTHONPATH tweaks (see [tool.hatch.build] below)
package = true

[tool.hatch.build]
# editable installs ("uv sync") add these folders to sys.path, via a .pth file
dev-mode-dirs = [".", "vendor"]

[tool.hatch.build.targets.wheel]
# for non-editable builds: "vendor/xxx" packages are installed as top-level "xxx" packages
packages = ["config", "pychronia_common", "pychronia_game", "pychronia_cms", "vendor/templateaddons", "vendor/fileservers"]


[tool.uv.sources]
django-zodb = { git = "https://github.com/pakal/django-zodb.git", rev = "556c54da5a8b32f632097449fffcb25d0f607c5f" }
python-aiml = { git = "https://github.com/paulovn/python-aiml", rev = "21c77d5e204dfdbaef315e570fdd918b852c738b" }
Django-Select2 = { git = "https://github.com/pakal/django-select2.git", rev = "32547b7e9a4d1c4ffe0cefe0fbf0c9262095456e" }
cmsplugin-simple-gallery = { git = "https://github.com/pakal/cmsplugin-simple-gallery.git", rev = "c2e5c4d61f6a6cf306d350699a6ef033f8b96b06" }
django-cms-jplayer = { git = "https://github.com/pakal/django-cms-jplayer.git", rev = "a4458ed2b271e47280cd307cdcc4a099f3b240cf" }
django-request = { git = "https://github.com/django-request/django-request.git" }


[tool.pytest.ini_options]
# pytest-django settings: "--ds" has precedence over a DJANGO_SETTINGS_MODULE environment variable (eg. set by an IDE
# or a shell for the dev server), unlike the "DJANGO_SETTINGS_MODULE" ini option; another "--ds" on the command line
# still overrides it. The e2e/ subfolder has its own pytest.ini, with its own settings.
addopts = ["--ds=config.settings.game_test"]
django_debug_mode = "keep"  # DEBUG of settings, ie. True, required by reset_zodb_structure() (pytest-django forces False by default)
django_find_project = false  # the project is installed in the venv, no sys.path tweak needed (nor pychronia_game/tests/manage.py)
testpaths = ["pychronia_game/tests"]
norecursedirs = ["e2e", "____backup", "test_game_files", ".*", "__pycache__"]
markers = ["e2e: Playwright browser end-to-end tests (run with: pytest pychronia_game/tests/e2e)"]


[tool.ruff]
# lint: "uv run ruff check ."  -  format: "uv run ruff format ."
line-length = 120
target-version = "py311"
extend-exclude = [
    "vendor/___aiml",  # untracked old copy of third-party code
    "pychronia_game/views/abilities/djinn_chat_mod.py",  # dead draft, not valid code
]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",  # ruff defaults (pycodestyle errors, pyflakes)
    "W",  # pycodestyle warnings
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "DJ",  # flake8-django
    "PIE",  # flake8-pie
    "C4",  # flake8-comprehensions
]
ignore = [
    "F403", "F405",  # "from pychronia_game.common import *" is the project-wide convention
    "E402",  # many scripts must bootstrap sys.path/settings (setup_pychronia_env) before other imports
    "E731",  # lambda assignments, eg. "gettext = lambda s: s" placeholder in settings
    "UP031",  # %-formatting is fine (and required for translated strings)
    "C408",  # dict(a=1) calls are fine
    "B904",  # "raise ... from err" in except blocks: only changes traceback chaining
    "B905",  # zip() without strict=
    "B007",  # unused loop variables: harmless, and the rename fix is unsafe (variable may be used after the loop)
    "W291", "W293",  # trailing whitespace: the formatter handles code, the rest is inside (possibly significant) string literals
]
# NO "I" (isort): settings modules depend on the order of their star-imports

[tool.ruff.lint.per-file-ignores]
# modules re-exporting names, eg. views referenced by dotted path in urls.py and game data
"pychronia_game/common.py" = ["F401"]
"pychronia_game/views/__init__.py" = ["F401"]
"pychronia_game/datamanager/__init__.py" = ["F401"]
"vendor/fileservers/__init__.py" = ["F401"]
"pychronia_game/tests/_test_tools.py" = ["F401"]  # star-imported by test modules
"**/*settings*.py" = ["F401"]  # settings are star-import chains
"config/settings/*.py" = ["F401"]
# test idioms: "assert x == True", "assert False", "assertRaises(Exception)", attribute accesses expected to raise, unused call results
"**/tests/**" = ["E712", "E741", "B011", "B017", "B018", "F841"]

[tool.ruff.format]
# defaults (black-compatible): double quotes, magic trailing commas, line endings kept as they are
