[tool.poetry]
name = "pychronia"
version = "0.1.0"
description = ""
authors = ["PKL <pythoniks@gmail.com>"]
readme = "README.md"


[tool.poetry.dependencies]
python = "^3.11"

PyMySQL = "^1.0.2"

Django = ">=4.2.4"

django-compat-patcher = "^0.12"
compat-patcher-core = "^2.2"

Pillow = "^10"

easy-thumbnails = "^2.8.5"
django-filer = "^3.0.3"

ZODB = ">=5.7.0"

django-zodb = { git = "https://github.com/pakal/django-zodb.git", rev = "556c54da5a8b32f632097449fffcb25d0f607c5f" }

PyYAML = ">=6.0.2"

pycryptodome = "^3.14.1"

python-aiml = { git = "https://github.com/paulovn/python-aiml", rev = "21c77d5e204dfdbaef315e570fdd918b852c738b" }

# Django-Select2==4.2.2 is OUTDATED, and then form "fields" were removed from project...
Django-Select2 = { git = "https://github.com/pakal/django-select2.git", rev = "6b1adada50ce53f4c51dd6d409371705627fa17e" }

beautifulsoup4 = "^4.11.1"

django-sekizai = "^3.0.1"

# decorator==5.1.1 cannot work with resolving_decorator for now, we need decoratorx instead
decorator = "4.4.0"

requests = "^2.28.0"

pytz = "*"

docutils = "*"

pyparsing = "^3.1.1"



[tool.poetry.group.dev.dependencies]

pytest = ">=7.1.2"
pip-review = "*"
logging_tree = "*"

django-cprofile-middleware = "^1.0.5"
django_debug_toolbar = "*"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
