[project]
name = "pychronia"
version = "0.1.0"
description = "Portal for alternate reality games, built on Django and ZODB"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PKL", email = "pythoniks@gmail.com" }]
requires-python = ">=3.11"

dependencies = [
    "PyMySQL>=1.0.2",
    "Django>=4.2.4",
    "django-compat-patcher>=0.14",
    "compat-patcher-core>=2.4",
    "Pillow>=11",
    "easy-thumbnails[svg]>=2.8.5",
    "django-filer>=3.0.3",
    "ZODB>=5.7.0",
    "django-zodb",  # see [tool.uv.sources]
    # needed by django-zodb for mysql:// ZODB_URL (prod) and by bin/daily_game_maintenance.sh (zodbpack)
    "RelStorage>=3.5",
    "PyYAML>=6.0.2",
    "pycryptodome>=3.14.1",
    "python-aiml",  # see [tool.uv.sources]
    # Django-Select2==4.2.2 is OUTDATED, and then form "fields" were removed from project...
    "Django-Select2",  # see [tool.uv.sources]
    "beautifulsoup4>=4.11.1",
    "django-sekizai>=4",
    # pychronia_game.common uses decoratorx, so that rsdecorator can flatten the signatures of decorated methods
    "decorator>=5",
    "RSDecorator>=0.1.0",
    "requests>=2.28.0",
    "pytz",
    "docutils",
    "pyparsing>=3.1.1",
]

[project.optional-dependencies]
# Django-CMS portal (pychronia_cms package), NOT functional with current Django versions
cms = [
    "django-cms==3.10",
    "djangocms-admin-style",
    "djangocms-page-sitemap==1.0.0",
    "djangocms-text-ckeditor==5.1.0",
    "djangocms-link==3.0.0",
    "djangocms-snippet==3.0.0",
    "djangocms-rawhtml==1.2",
    "cmsplugin-filer==1.1.3",
    "cmsplugin-rst",  # see [tool.uv.sources]
    "cmsplugin-simple-gallery",  # see [tool.uv.sources]
    "django-inline-ordering==1.0.2",  # for cmsplugin-simple-gallery
    "django-cms-jplayer",  # see [tool.uv.sources]
    # if trouble with "Unknown column 'zinnia_entry.content_placeholder_id' in 'field list" : python manage.py reset zinnia
    "django-blog-zinnia==0.20",
    "cmsplugin-zinnia",  # see [tool.uv.sources]
    "django-contrib-comments==2.2.0",
    "django-mptt==0.13.4",
    "django-treebeard",
    "django-reversion==5.0.0",
    "django-request==1.6.1",  # for quick HTTP visit stats
    "django-apptemplates==1.5",
    "django-appconf==1.0.5",
    "django-admin-jqueryui==1.8.22",  # obsolete stuff
]

[dependency-groups]
dev = [
    "pytest>=7.1.2",
    "pip-review",
    "logging_tree",
    "django-cprofile-middleware>=1.0.5",
    "django_debug_toolbar",
    # used to compile MetalRadiance SCSS sources, see pychronia_common/static/MetalRadiance/build.bat ;
    # pyscss==1.4.0 is abandoned and incompatible with Python 3.11+'s stricter "re" module, so it is
    # patched at runtime by scss_build.py before compiling
    "pyscss==1.4.0",
]


[tool.uv]
# The legacy pins of the "cms" extra declare obsolete upper bounds, which we ignore
override-dependencies = [
    "Django>=4.2.4",
]
package = false  # this is an application, scripts bootstrap sys.path via setup_pychronia_env.py

[tool.uv.sources]
django-zodb = { git = "https://github.com/pakal/django-zodb.git", rev = "556c54da5a8b32f632097449fffcb25d0f607c5f" }
python-aiml = { git = "https://github.com/paulovn/python-aiml", rev = "21c77d5e204dfdbaef315e570fdd918b852c738b" }
Django-Select2 = { git = "https://github.com/pakal/django-select2.git", rev = "6b1adada50ce53f4c51dd6d409371705627fa17e" }
cmsplugin-rst = { git = "https://github.com/pakal/cmsplugin-rst" }
cmsplugin-simple-gallery = { git = "https://github.com/pakal/cmsplugin-simple-gallery.git" }
django-cms-jplayer = { git = "https://github.com/pakal/django-cms-jplayer.git" }
cmsplugin-zinnia = { git = "https://github.com/pakal/cmsplugin-zinnia.git", rev = "76f8de72a37b0525a8a5f65e99f0412d0a55563c" }


[tool.pytest.ini_options]
testpaths = ["pychronia_game/tests"]
