[project]
name = "pychronia"
version = "0.1.0"
description = "Portal for alternate reality games, built on Django and ZODB"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PKL", email = "pythoniks@gmail.com" }]
requires-python = ">=3.11"

dependencies = [
    "PyMySQL>=1.0.2",
    "Django>=4.2.4",
    "django-compat-patcher>=0.14",
    "compat-patcher-core>=2.4",
    "Pillow>=11",
    "easy-thumbnails[svg]>=2.8.5",
    "django-filer>=3.0.3",
    "ZODB>=5.7.0",
    "django-zodb",  # see [tool.uv.sources]
    # needed by django-zodb for mysql:// ZODB_URL (prod) and by bin/daily_game_maintenance.sh (zodbpack)
    "RelStorage>=3.5",
    "PyYAML>=6.0.2",
    "pycryptodome>=3.14.1",
    "python-aiml",  # see [tool.uv.sources]
    # Django-Select2==4.2.2 is OUTDATED, and then form "fields" were removed from project...
    "Django-Select2",  # see [tool.uv.sources]
    "beautifulsoup4>=4.11.1",
    "django-sekizai>=4",
    # pychronia_game.common uses decoratorx, so that rsdecorator can flatten the signatures of decorated methods
    "decorator>=5",
    "RSDecorator>=0.1.0",
    "requests>=2.28.0",
    "pytz",
    "docutils",
    "pyparsing>=3.1.1",
]

[project.optional-dependencies]
# Django-CMS portal (pychronia_cms package). Verified working on Django 5.1.15 as of the
# 2026-10-15 cms-upgrade-ladder (Django 2.2.13 -> 5.1.15, django-cms 3.6.0 -> 5.0.13), run
# from the detached "cms-upgrade-ladder" worktree/branch - see DJANGO_CMS_UPGRADE_REPORT.md
# for the full rung-by-rung history and data-migration steps. Versions below are the ones
# actually exercised by that ladder (not aspirational pins); some differ from what this
# extra used to declare because those older pins were never actually verified to work.
cms = [
    "django-cms==5.0.13",
    # cms4+ architecture (Title->PageContent, PageUrl, versioned placeholders) requires these two:
    "djangocms-versioning==2.8.0",
    "djangocms-alias==3.2.0",
    "djangocms-admin-style==3.3.1",
    "djangocms-page-sitemap==1.1.0",
    # djangocms-text-ckeditor replaced by djangocms-text (the successor plugin); its own
    # migrations auto-copy existing TextPlugin.body rows and drop the old ckeditor table.
    "djangocms-text==1.0.2",
    "nh3",  # djangocms-text's HTML sanitizer
    "lxml",  # djangocms-text's HTML parser
    "djangocms-link==5.2.0",
    "djangocms-snippet==5.0.2",
    "djangocms-rawhtml==1.3.0",
    # cmsplugin-filer removed (rung 11 Stage B): abandoned, no cms4+ release. Its live
    # FilerImagePlugin/FilerVideoPlugin rows were migrated in-place to the two plugins below.
    "djangocms-picture==4.1.1",
    "djangocms-video==3.1.0",
    "django-filer>=3.6.0",  # bumped past the 1.x line now that cmsplugin-filer is removed above
    "easy-thumbnails[svg]>=2.10.1",  # <2.10.1's scale_and_crop processor hardcodes the Pillow-10-removed Image.ANTIALIAS
    "cmsplugin-rst",  # see [tool.uv.sources]
    "cmsplugin-simple-gallery",  # see [tool.uv.sources]
    "django-inline-ordering>=1.0.2",  # for cmsplugin-simple-gallery
    "django-cms-jplayer",  # see [tool.uv.sources]
    # if trouble with "Unknown column 'zinnia_entry.content_placeholder_id' in 'field list" : python manage.py reset zinnia
    "django-blog-zinnia==0.20",
    "cmsplugin-zinnia",  # see [tool.uv.sources]
    "django-contrib-comments==1.9.1",
    "django-mptt==0.10.0",
    "django-treebeard",
    "django-reversion==3.0.3",
    "django-request",  # see [tool.uv.sources]; for quick HTTP visit stats
    "django-apptemplates==1.4",
    "django-appconf==1.0.3",
    "django-admin-jqueryui==1.8.22",  # obsolete stuff
]

[dependency-groups]
dev = [
    "pytest>=7.1.2",
    "pip-review",
    "logging_tree",
    "django-cprofile-middleware>=1.0.5",
    "django_debug_toolbar",
    # used to compile MetalRadiance SCSS sources, see pychronia_common/static/MetalRadiance/build.bat ;
    # pyscss==1.4.0 is abandoned and incompatible with Python 3.11+'s stricter "re" module, so it is
    # patched at runtime by scss_build.py before compiling
    "pyscss==1.4.0",
    "pytest-playwright>=0.10.0",
]


[tool.uv]
# The legacy pins of the "cms" extra declare obsolete upper bounds, which we ignore.
# django-polymorphic: django-filer's own metadata caps it below what cms4+/Django 5.1 needs
# (already proven safe to override, verified throughout the cms-upgrade-ladder).
override-dependencies = [
    "Django>=4.2.4",
    "django-polymorphic>=3.0.0",
]
package = false  # this is an application, scripts bootstrap sys.path via setup_pychronia_env.py

[tool.uv.sources]
django-zodb = { git = "https://github.com/pakal/django-zodb.git", rev = "556c54da5a8b32f632097449fffcb25d0f607c5f" }
python-aiml = { git = "https://github.com/paulovn/python-aiml", rev = "21c77d5e204dfdbaef315e570fdd918b852c738b" }
Django-Select2 = { git = "https://github.com/pakal/django-select2.git", rev = "6b1adada50ce53f4c51dd6d409371705627fa17e" }
cmsplugin-rst = { git = "https://github.com/pakal/cmsplugin-rst" }
cmsplugin-simple-gallery = { git = "https://github.com/pakal/cmsplugin-simple-gallery.git" }
django-cms-jplayer = { git = "https://github.com/pakal/django-cms-jplayer.git" }
cmsplugin-zinnia = { git = "https://github.com/pakal/cmsplugin-zinnia.git", rev = "76f8de72a37b0525a8a5f65e99f0412d0a55563c" }
django-request = { git = "https://github.com/django-request/django-request.git" }


[tool.pytest.ini_options]
testpaths = ["pychronia_game/tests"]
norecursedirs = ["e2e", "____backup", "test_game_files", ".*", "__pycache__"]
markers = ["e2e: Playwright browser end-to-end tests (run with: pytest pychronia_game/tests/e2e)"]
