{% comment %}
Flag icon of a language, shared by the CMS header and game footer language switchers.
Parameters: "code" (language code) and "name" (displayed when no flag exists for this language).
{% endcomment %}{% if code == "fr" %}
<svg class="lang-flag" viewBox="0 0 3 2" width="30" height="20" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect width="1" height="2" x="0" fill="#0055A4"/>
    <rect width="1" height="2" x="1" fill="#FFFFFF"/>
    <rect width="1" height="2" x="2" fill="#EF4135"/>
</svg>
{% elif code == "en" %}
<svg class="lang-flag" viewBox="0 0 60 30" width="30" height="20" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect width="60" height="30" fill="#00247d"/>
    <path d="M0,0 L60,30 M60,0 L0,30" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M0,0 L60,30 M60,0 L0,30" stroke="#cf142b" stroke-width="2"/>
    <path d="M30,0 V30 M0,15 H60" stroke="#FFFFFF" stroke-width="10"/>
    <path d="M30,0 V30 M0,15 H60" stroke="#cf142b" stroke-width="6"/>
</svg>
{% else %}
<span class="lang-flag-name">{{ name }}</span>
{% endif %}
