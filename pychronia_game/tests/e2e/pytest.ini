# Pytest config of the e2e suite, used instead of the [tool.pytest.ini_options] of the root pyproject.toml whenever
# pytest is only given paths inside this folder (eg. "pytest pychronia_game/tests/e2e"), since pytest looks for its
# config file starting from the common ancestor of these paths. It makes pytest-django use the e2e settings.
[pytest]
# "--ds" has precedence over a DJANGO_SETTINGS_MODULE environment variable, unlike the "DJANGO_SETTINGS_MODULE" option
addopts = --ds=config.settings.e2e
# DEBUG of settings, ie. True, required by reset_zodb_structure() (pytest-django forces False by default)
django_debug_mode = keep
django_find_project = false
markers =
    e2e: Playwright browser end-to-end tests
